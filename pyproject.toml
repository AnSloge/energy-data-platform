[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-platform"
version = "0.1.0"
description = "Norwegian electricity price analytics and forecasting: Bronze → Silver → Gold, ML and a dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
explore = ["pandas>=2", "matplotlib>=3.8", "jupyter>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/energy_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: calls live external APIs"]

[tool.ruff]
line-length = 100